<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">PM-Master · AI Native 项目经理成长工作台</title>
  <desc id="desc">以 GB/T 41831-2022 为成长坐标的等级无关（L1-L5）单用户工作台：真实项目工作为训练场，AI 教练助手全程陪伴，干活即练级。右侧为 L1 到 L5 五级能力阶梯与能力雷达图形。</desc>

  <defs>
    <linearGradient id="stepGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e2a45"/>
      <stop offset="1" stop-color="#1d5c8f"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" rx="26" fill="#06090f"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="25.5" fill="none" stroke="#16283d" stroke-width="1"/>

  <!-- title block -->
  <g id="title-block" transform="translate(64 52)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3" fill="#5b7a99">GB/T 41831-2022 · LEVEL-AGNOSTIC · L1–L5</text>
    <text x="0" y="86" font-size="56" font-weight="700" fill="#eaf4ff">PM-Master</text>
    <text x="0" y="128" font-size="26" font-weight="600" fill="#38bdf8">AI Native 项目经理成长工作台</text>
    <text x="0" y="168" font-size="19" fill="#9db4cc">真实项目工作为训练场，AI 教练助手全程陪练——</text>
    <text x="0" y="196" font-size="19" fill="#9db4cc">评估、演练、实战、沉淀，一个飞轮闭环。</text>
    <text x="0" y="252" font-size="30" font-weight="700" fill="#eaf4ff">干活即练级。</text>
  </g>

  <!-- project proof: five-level ladder L1 → L5 with radar motif -->
  <g id="level-ladder" transform="translate(660 60)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7f9ab5">
      <rect x="0"   y="216" width="92" height="64"  rx="8" fill="url(#stepGlow)" opacity="0.55"/>
      <rect x="96"  y="178" width="92" height="102" rx="8" fill="url(#stepGlow)" opacity="0.68"/>
      <rect x="192" y="140" width="92" height="140" rx="8" fill="url(#stepGlow)" opacity="0.8"/>
      <rect x="288" y="102" width="92" height="178" rx="8" fill="url(#stepGlow)" opacity="0.92"/>
      <rect x="384" y="64"  width="92" height="216" rx="8" fill="url(#stepGlow)"/>
      <text x="46"  y="256" text-anchor="middle" fill="#cfe6fb" font-weight="700">L1</text>
      <text x="142" y="220" text-anchor="middle" fill="#cfe6fb" font-weight="700">L2</text>
      <text x="238" y="182" text-anchor="middle" fill="#cfe6fb" font-weight="700">L3</text>
      <text x="334" y="144" text-anchor="middle" fill="#cfe6fb" font-weight="700">L4</text>
      <text x="430" y="106" text-anchor="middle" fill="#ffffff" font-weight="700">L5</text>
      <text x="46"  y="282" text-anchor="middle" font-size="16">辅助</text>
      <text x="142" y="282" text-anchor="middle" font-size="16">初级</text>
      <text x="238" y="282" text-anchor="middle" font-size="16">中级</text>
      <text x="334" y="282" text-anchor="middle" font-size="16">高级</text>
      <text x="430" y="282" text-anchor="middle" font-size="16">专家</text>
    </g>
    <!-- radar motif above L5 -->
    <g id="radar" transform="translate(430 22)">
      <path d="M0,-40 L23,-23 L40,-6 L20,18 L0,34 L-20,18 L-40,-6 L-23,-23 Z"
            fill="none" stroke="#274b6d" stroke-width="1.4"/>
      <path d="M0,-26 L15,-15 L26,-4 L13,12 L0,22 L-13,12 L-26,-4 L-15,-15 Z"
            fill="#38bdf8" fill-opacity="0.28" stroke="#38bdf8" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="2.6" fill="#38bdf8"/>
    </g>
    <text x="430" y="-32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5b7a99">composite = min(K, C, E)</text>
  </g>

  <!-- metadata strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5b7a99">
    <text x="64" y="338">8 页面 · 129 API · 35 表 · 双能力面统一角色 · acceptance 75 + e2e 12 全绿</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="64" viewBox="0 0 420 64"
     role="img" aria-labelledby="title desc">
  <title id="title">README made with beautify-github-readme</title>
  <desc id="desc">署名条：本 README 使用 beautify-github-readme 设计，采用 PM-Master 项目的深色底与青蓝阶梯 motif。</desc>
  <rect width="420" height="64" rx="12" fill="#06090f"/>
  <rect x="0.5" y="0.5" width="419" height="63" rx="11.5" fill="none" stroke="#16283d"/>
  <!-- project-native mini ladder motif -->
  <g fill="#1d5c8f">
    <rect x="24" y="40" width="9" height="12" rx="2"/>
    <rect x="35" y="32" width="9" height="20" rx="2"/>
    <rect x="46" y="24" width="9" height="28" rx="2"/>
    <rect x="57" y="16" width="9" height="36" rx="2" fill="#38bdf8"/>
  </g>
  <text x="84" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#5b7a99">README MADE WITH</text>
  <text x="84" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#cfe6fb">beautify-github-readme</text>
  <text x="386" y="45" font-family="-apple-system, sans-serif" font-size="16" fill="#38bdf8">→</text>
</svg>

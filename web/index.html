<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM-Master · 项目经理成长工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233ea6ff'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%2306121f' font-family='sans-serif' font-weight='700'%3E%E9%A1%B9%3C/text%3E%3C/svg%3E" />
  <style>
    /* ============================================================
       R6.8 科技风设计令牌系统（冷色调 · 双主题 · 全组件层）
       深色默认（暗蓝底 + 电光青 + 几何网格微光），data-theme="light" 亮色（冷白蓝）
       旧变量名（--paper/--ink/--ink3/--cin/--navy/--line/--ok/--warn/--hair）保留为兼容别名
       形状规则（全站统一）：交互件 radius 8-10px；卡片 12px；模态 14px；徽标/芯片 pill
       动效规则：仅 transform/opacity；缓动 --ease；prefers-reduced-motion 全关
       ============================================================ */
    :root, [data-theme="dark"] {
      --bg:#0a1120; --surface:#111b2e; --surface-2:#16223a; --surface-3:#1b2a46; --head:#0c1424;
      --text:#dbe6f5; --text-2:#8ea3c0; --line:#243550; --hair:#2c4066;
      --accent:#3ea6ff; --accent-2:#5aa8ff; --on-accent:#06121f;
      --ok:#3ecf8e; --warn:#e8b33c; --cin:#f2665c; --hot:#ff9f43;
      --ok-soft:rgba(62,207,142,.12); --warn-soft:rgba(232,179,60,.13); --danger-soft:rgba(242,102,92,.13); --accent-soft:rgba(62,166,255,.13);
      --pr2-bg:rgba(147,112,219,.18); --pr2-fg:#b9a3e8; --gb-bg:rgba(212,164,80,.16); --gb-fg:#e0bd7a;
      --glow:0 0 0 1px rgba(62,166,255,.14), 0 10px 30px rgba(2,8,23,.55);
      --shadow:0 8px 24px rgba(2,8,23,.45);
      --grid:rgba(148,163,184,.05);
      --accent-grad:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 68%, var(--ok)));
      --head-fg:#cfe0f4; --head-fg-2:#9fb4d0;
      --overlay:rgba(4,10,22,.62);
      --sheen:rgba(255,255,255,.06);
      --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
      /* 兼容别名（组件内联 var() 引用面） */
      --paper:var(--surface-2); --ink:var(--text); --ink3:var(--text-2); --navy:var(--accent-2);
    }
    [data-theme="light"] {
      --bg:#eef3fa; --surface:#ffffff; --surface-2:#f2f6fc; --surface-3:#e7eef8; --head:#10233c;
      --text:#0f2138; --text-2:#4f6886; --line:#d3e0f0; --hair:#b9cde6;
      --accent:#0d6fd6; --accent-2:#1f6fc4; --on-accent:#ffffff;
      --ok:#177c4d; --warn:#96691a; --cin:#c0483c; --hot:#d97706;
      --ok-soft:#e4f4ec; --warn-soft:#f8efd9; --danger-soft:#fbe9e7; --accent-soft:#e0effc;
      --pr2-bg:#ece4f6; --pr2-fg:#6b4ba0; --gb-bg:#f3e6d0; --gb-fg:#8a5a1e;
      --glow:0 0 0 1px rgba(13,111,214,.12), 0 10px 26px rgba(30,60,100,.12);
      --shadow:0 8px 22px rgba(30,60,100,.10);
      --grid:rgba(59,94,138,.05);
      --accent-grad:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #43b4ff));
      --head-fg:#e8f1fb; --head-fg-2:#a8bfd8;
      --overlay:rgba(30,60,100,.35);
      --sheen:rgba(13,111,214,.05);
      --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
      --paper:var(--surface-2); --ink:var(--text); --ink3:var(--text-2); --navy:var(--accent-2);
    }
    :root { --ease:cubic-bezier(.16,1,.3,1); }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { color-scheme:dark; }
    [data-theme="light"] { color-scheme:light; }
    body {
      font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(1100px 520px at 85% -10%, var(--accent-soft), transparent 60%),
        radial-gradient(900px 480px at -10% 110%, var(--ok-soft), transparent 55%),
        linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px,
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/34px 100%,
        var(--bg);
      color:var(--text); min-height:100vh; height:100vh; display:flex; flex-direction:column;
      transition:background-color .25s, color .25s;
    }
    ::selection { background:var(--accent); color:var(--on-accent); }
    ::-webkit-scrollbar { width:9px; height:9px; }
    ::-webkit-scrollbar-thumb { background:var(--hair); border-radius:6px; border:2px solid transparent; background-clip:content-box; }
    ::-webkit-scrollbar-thumb:hover { background:var(--accent); background-clip:content-box; }
    ::-webkit-scrollbar-track { background:transparent; }
    * { scrollbar-width:thin; scrollbar-color:var(--hair) transparent; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-radius:4px; }

    /* ---------- 按钮体系（全局基座：任何 button 皆有科技风外观；.pri 主行动） ---------- */
    button {
      font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line);
      border-radius:8px; padding:6px 12px; font-size:12.5px; cursor:pointer; line-height:1.5;
      transition:border-color .15s var(--ease), background .15s, transform .1s, box-shadow .2s, color .15s;
    }
    button:hover:not(:disabled) { border-color:var(--hair); background:var(--surface-3); }
    button:active:not(:disabled) { transform:scale(.97); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    button.pri, .mini.pri, .lvbtns button.on {
      background:var(--accent-grad); color:var(--on-accent); border-color:transparent; font-weight:600;
      box-shadow:0 2px 12px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    button.pri:hover:not(:disabled) { filter:brightness(1.1); box-shadow:0 4px 16px color-mix(in srgb, var(--accent) 38%, transparent); background:var(--accent-grad); }
    button.danger { border-color:color-mix(in srgb, var(--cin) 45%, transparent); color:var(--cin); background:var(--danger-soft); }
    button.danger:hover:not(:disabled) { background:color-mix(in srgb, var(--cin) 16%, var(--surface)); }
    .mini { border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:3px 9px; font-size:11.5px; }
    .mini:hover:not(:disabled) { border-color:var(--accent); background:var(--surface); color:var(--text); }
    .mini:active:not(:disabled) { transform:scale(.97); }

    /* ---------- 表单控件 ---------- */
    input:not([type=checkbox]):not([type=radio]), select, textarea {
      border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; outline:none;
      background:var(--surface); color:var(--text); font-family:inherit;
      transition:border-color .2s, box-shadow .2s;
    }
    textarea { line-height:1.6; resize:vertical; min-height:56px; }
    input:not([type=checkbox]):not([type=radio]):focus, select:focus, textarea:focus {
      border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
    }
    input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--text-2) 75%, transparent); }
    input[type=checkbox], input[type=radio] { width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex:none; }
    label { user-select:none; }

    /* ---------- 顶栏（品牌条：深色导航带，双主题恒深，底部电光细线） ---------- */
    header {
      background:linear-gradient(120deg, var(--head), color-mix(in srgb, var(--head) 78%, var(--accent) 22%));
      color:var(--head-fg); padding:10px 18px; display:flex; align-items:center; gap:12px;
      border-bottom:1px solid rgba(120,160,210,.22); box-shadow:var(--shadow); position:relative; z-index:10; flex:none;
    }
    header::after {
      content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; opacity:.65; pointer-events:none;
      background:linear-gradient(90deg, transparent, var(--accent) 30%, color-mix(in srgb, var(--ok) 70%, var(--accent)) 60%, transparent);
    }
    header .seal {
      width:28px; height:28px; background:var(--accent-grad); border-radius:8px;
      display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--on-accent); font-size:14px;
      box-shadow:0 0 14px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.25);
    }
    header h1 { font-size:15px; letter-spacing:2px; font-weight:600; color:var(--head-fg); }
    header .lv { margin-left:10px; font-size:12px; color:var(--head-fg-2); }
    .theme-btn {
      margin-left:8px; border:1px solid rgba(160,190,220,.35); background:rgba(160,190,220,.08); color:var(--head-fg);
      border-radius:8px; padding:4px 9px; font-size:12px; display:inline-flex; align-items:center; gap:5px;
      transition:background .2s, border-color .2s, transform .1s;
    }
    .theme-btn:hover { background:rgba(160,190,220,.2); border-color:var(--accent); }
    .theme-btn:active { transform:scale(.95); }

    /* ---------- 页签导航（单行；激活页签渐变底 + 顶部电光标） ---------- */
    .tabs {
      display:flex; align-items:end; gap:4px; padding:9px 18px 0; border-bottom:2px solid var(--hair);
      background:linear-gradient(180deg, color-mix(in srgb, var(--surface) 55%, transparent), transparent); flex:none;
    }
    .tabs .tab {
      display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; border-bottom:none;
      background:transparent; border-radius:10px 10px 0 0; padding:7px 14px; font-size:12.5px; color:var(--text-2);
      transition:color .15s, background .15s, box-shadow .15s;
    }
    .tabs .tab svg { opacity:.8; }
    .tabs .tab:hover:not(.on) { color:var(--accent); background:var(--accent-soft); }
    .tabs .tab.on {
      background:linear-gradient(180deg, var(--surface), var(--surface) 60%, var(--bg));
      color:var(--accent); font-weight:600; border-color:var(--hair);
      box-shadow:inset 0 2px 0 var(--accent), 0 -4px 14px rgba(2,8,23,.12);
    }

    /* ---------- 主区与卡片 ---------- */
    main { flex:1; min-height:0; padding:14px 18px; }
    .page { height:100%; animation:pageIn .3s var(--ease) both; }
    .card {
      background:linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 92%, var(--accent) 8%));
      border:1px solid var(--line); border-radius:12px; padding:14px 16px; overflow:auto; box-shadow:var(--shadow);
      min-width:0; transition:border-color .2s, box-shadow .2s;
    }
    .card:hover { border-color:color-mix(in srgb, var(--hair) 70%, var(--accent) 30%); }
    .card h3 {
      display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px; color:var(--text-2);
      letter-spacing:1px; font-weight:600;
    }
    .card h3::before {
      content:""; width:3px; height:13px; border-radius:2px; flex:none;
      background:var(--accent-grad); box-shadow:0 0 8px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    /* ---------- 列表行 / 场景卡 / 预警 ---------- */
    .sc { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; background:var(--surface); transition:border-color .15s, transform .15s, box-shadow .15s, background .15s; }
    .sc:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow); }
    .sc.locked { opacity:.45; cursor:not-allowed; transform:none; }
    .sc b { display:block; font-size:13px; }
    .sc small { color:var(--ink3); font-size:10.5px; }
    .sc.sel { border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
    .rowitem { display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--surface); transition:border-color .15s, background .15s; }
    .rowitem:hover { border-color:var(--hair); background:var(--surface-2); }
    .rowitem b { font-size:13px; }
    .rowitem small { display:block; color:var(--ink3); font-size:11px; }
    .alert-mini { border:1px solid color-mix(in srgb, var(--cin) 40%, transparent); border-left:3px solid var(--cin); background:var(--danger-soft); border-radius:9px; padding:8px 10px; margin-bottom:8px; font-size:11.5px; }
    .alert-mini b { display:block; font-size:12px; color:var(--cin); }
    .alert-mini small { color:var(--ink3); display:block; margin-top:2px; }

    /* ---------- 阶段/分段选择器（GROW 轨、内部 tab、等级轨） ---------- */
    .growbar { display:flex; gap:4px; }
    .gseg {
      flex:1; text-align:center; padding:6px 0; font-size:11px; border-radius:8px;
      background:var(--surface-2); color:var(--ink3); border:1px solid transparent; font-family:inherit;
      transition:background .15s, color .15s, border-color .15s, box-shadow .2s, transform .1s;
    }
    button.gseg { cursor:pointer; }
    button.gseg:hover { border-color:var(--accent); color:var(--accent); }
    button.gseg:active { transform:scale(.98); }
    .gseg span { display:block; font-size:10px; }
    .gseg.cur { background:var(--accent-grad); color:var(--on-accent); font-weight:700; border-color:transparent; box-shadow:0 2px 10px color-mix(in srgb, var(--accent) 30%, transparent); }
    .gseg.done { background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb, var(--ok) 30%, transparent); }

    /* ---------- 芯片 / 徽标 ---------- */
    .pill { display:inline-block; font-size:10.5px; border-radius:8px; padding:1px 8px; border:1px solid var(--line); margin:2px; color:var(--accent-2); background:var(--accent-soft); }
    .badge { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; border-radius:999px; padding:1px 8px; background:var(--warn-soft); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
    .badge.cnt-err { background:var(--danger-soft); color:var(--cin); border-color:color-mix(in srgb, var(--cin) 35%, transparent); }
    .badge.cnt-ok { background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb, var(--ok) 35%, transparent); }

    /* ---------- 通知气泡 / 提示条 ---------- */
    .notice { border:1px solid var(--accent); border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:9px; padding:8px 12px; margin-bottom:10px; font-size:12.5px; line-height:1.6; }
    .notice.warn { border-color:var(--warn); border-left-color:var(--warn); background:var(--warn-soft); }
    .notice.danger { border-color:var(--cin); border-left-color:var(--cin); background:var(--danger-soft); }
    .empty { padding:16px 12px; text-align:center; color:var(--ink3); font-size:12px; line-height:1.7; border:1px dashed var(--hair); border-radius:10px; background:color-mix(in srgb, var(--surface-2) 55%, transparent); }

    /* ---------- 会话消息 ---------- */
    #msgs { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
    .m { max-width:88%; padding:9px 12px; border-radius:12px; font-size:13.5px; line-height:1.7; white-space:pre-wrap; animation:msgIn .25s var(--ease) both; }
    .m.ai { background:var(--surface-2); border:1px solid var(--line); border-left:3px solid color-mix(in srgb, var(--accent) 60%, transparent); align-self:flex-start; }
    .m.me { background:var(--accent-grad); color:var(--on-accent); align-self:flex-end; border-bottom-right-radius:4px; box-shadow:0 2px 10px color-mix(in srgb, var(--accent) 22%, transparent); }
    .m.sys { align-self:center; font-size:11px; color:var(--ink3); border:1px dashed var(--hair); border-radius:8px; padding:3px 10px; }
    #bar { display:flex; gap:8px; }
    #bar input { flex:1; padding:10px 13px; font-size:13.5px; }
    #bar button { padding:0 18px; font-size:13px; }

    /* ---------- KPI 指标卡 / 进度条（数据组件） ---------- */
    .kpi-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .kpi {
      flex:1; min-width:88px; text-align:center; padding:9px 6px; background:var(--surface-2);
      border:1px solid var(--line); border-radius:10px; transition:border-color .15s, box-shadow .2s;
    }
    .kpi:hover { border-color:var(--hair); box-shadow:var(--shadow); }
    .kpi b { display:block; font-size:18px; font-family:var(--font-mono); font-variant-numeric:tabular-nums; line-height:1.2; }
    .kpi span { display:block; font-size:10.5px; color:var(--ink3); margin-top:2px; }
    .bar { height:7px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; overflow:hidden; }
    .bar > i { display:block; height:100%; border-radius:inherit; background:var(--navy); transition:width .4s var(--ease); }
    .bar.ok > i { background:var(--ok); } .bar.warn > i { background:var(--warn); } .bar.cin > i { background:var(--cin); }

    /* ---------- 数据表 ---------- */
    .tb { width:100%; border-collapse:collapse; font-size:12px; }
    .tb th { text-align:left; font-weight:600; font-size:10.5px; letter-spacing:1px; color:var(--ink3); border-bottom:1px solid var(--hair); padding:6px 8px; white-space:nowrap; }
    .tb td { padding:6px 8px; border-bottom:1px solid var(--line); }
    .tb tbody tr { transition:background .15s; }
    .tb tbody tr:hover { background:var(--surface-2); }
    .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
    pre { font-size:11.5px; line-height:1.7; white-space:pre-wrap; color:var(--text); }
    code, .mono { font-family:var(--font-mono); }
    details > summary { cursor:pointer; color:var(--accent-2); transition:color .15s; }
    details > summary:hover { color:var(--accent); }
    hr.divider { border:none; border-top:1px dashed var(--hair); margin:14px 0; }

    /* ---------- 等级切换按钮组 ---------- */
    .lvbtns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .lvbtns button { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; font-size:12.5px; color:var(--text); }
    .lvbtns button:hover:not(.on):not(:disabled) { border-color:var(--accent); }

    /* ---------- 通知中心（铃铛） ---------- */
    .bell { margin-left:auto; position:relative; }
    .bell-btn { background:transparent; border:1px solid transparent; color:var(--head-fg); border-radius:8px; padding:4px 7px; cursor:pointer; display:inline-flex; align-items:center; position:relative; line-height:1; transition:background .2s, border-color .2s, transform .15s; }
    .bell-btn:hover { background:rgba(160,190,220,.14); border-color:rgba(160,190,220,.35); color:var(--head-fg); }
    .bell-btn:active { transform:scale(.94); }
    .bell-badge { position:absolute; top:-6px; right:-9px; background:var(--cin); color:#fff; font-size:9.5px; border-radius:8px; padding:1px 5px; font-weight:700; box-shadow:0 0 8px color-mix(in srgb, var(--cin) 45%, transparent); font-family:var(--font-mono); }
    .bell-panel { position:absolute; right:0; top:32px; width:330px; max-height:420px; background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:12px; box-shadow:var(--glow); z-index:50; display:flex; flex-direction:column; overflow:hidden; animation:popIn .2s var(--ease) both; }
    .bell-head { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--line); font-size:12.5px; font-weight:600; letter-spacing:1px; }
    .bell-head button { border:none; background:none; color:var(--accent-2); font-size:11.5px; padding:2px 6px; }
    .bell-head button:hover { color:var(--accent); background:none; }
    .bell-list { overflow:auto; }
    .bell-empty { padding:22px; text-align:center; color:var(--ink3); font-size:12px; }
    .bell-item { padding:9px 12px; border-bottom:1px dashed var(--line); cursor:pointer; transition:background .15s; }
    .bell-item:hover { background:var(--surface-2); }
    .bell-item.read { opacity:.62; }
    .bell-item-top { display:flex; align-items:center; gap:6px; font-size:12.5px; }
    .bell-kind { width:15px; height:15px; flex:none; border-radius:5px; background:var(--surface-2); border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink3); }
    .bell-item.k-error .bell-kind { background:var(--cin); border-color:var(--cin); color:#fff; font-weight:700; }
    .bell-item.k-report .bell-kind { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
    .bell-title { flex:1; }
    .bell-dot { width:6px; height:6px; flex:none; border-radius:50%; background:var(--cin); box-shadow:0 0 6px var(--cin); }
    .bell-time { font-size:10.5px; color:var(--ink3); margin:3px 0 0 21px; font-family:var(--font-mono); }
    .bell-item a { display:inline-block; margin:3px 0 0 21px; font-size:11px; color:var(--accent-2); }

    /* ---------- AI 助手侧栏 ---------- */
    body.assistant-live { padding-right:300px; }
    body.assistant-live.assistant-collapsed { padding-right:0; }

  </style>
  <script>
    // 主题初始化：先于渲染读取偏好（localStorage > 默认深色科技风），消除闪白（FOUC）
    (function () {
      try {
        var t = localStorage.getItem('pm-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
